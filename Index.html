<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Render Data</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#eef2f3,#dfe9f3);
    min-height:100vh;
    color:#333;
}

.wrapper{
    width:90%;
    margin:auto;
    padding:20px;
}

/* Header */
header{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:white;
    text-align:center;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    margin-bottom:20px;
}

header h1{
    font-size:30px;
}

/* Menu */
#menu{
    display:flex;
    gap:10px;
    list-style:none;
    margin-bottom:20px;
    flex-wrap:wrap;
}

#menu li{
    padding:12px 18px;
    background:white;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

#menu li:hover,
.active{
    background:#4facfe;
    color:white;
    transform:translateY(-3px);
}

/* Content */
.content{
    display:none;
}

.show{
    display:block;
    animation:fade .4s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* Form */
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:12px 0;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#4facfe;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:#2196f3;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#4facfe;
    color:white;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

tr:hover{
    background:#f8f9fa;
}

/* List */
#list li{
    list-style:none;
    background:#f8f9fa;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    transition:.3s;
}

#list li:hover{
    transform:translateX(5px);
}

/* Card */
.card-item{
    background:linear-gradient(135deg,#f8f9fa,#ffffff);
    padding:15px;
    border-radius:12px;
    margin:10px 0;
    box-shadow:0 5px 10px rgba(0,0,0,.05);
    transition:.3s;
}

.card-item:hover{
    transform:translateY(-4px);
}

/* Responsive */
@media(max-width:768px){
    #menu{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<header>
    <h1>Aplikasi Render Data</h1>
    <p>Dashboard Data Sederhana & Modern</p>
</header>

<ul id="menu"></ul>

<!-- HOME -->
<div id="home" class="content box">
    <h2>Home</h2>
    <p>Selamat datang di aplikasi render data.</p>
</div>

<!-- DATA -->
<div id="data" class="content">

<div class="grid">

<div class="box">
    <h2>Tambah Data</h2>
    <input type="text" id="namaInput" placeholder="Masukkan nama">
    <button onclick="tambahData()">Tambah</button>
</div>

<div class="box">
    <h3>Table</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="box">
    <h3>List</h3>
    <ul id="list"></ul>
</div>

<div class="box">
    <h3>Card</h3>
    <div id="card"></div>
</div>

</div>
</div>

<!-- ABOUT -->
<div id="about" class="content box">
    <h2>About</h2>
    <p>Aplikasi ini menggunakan konsep:</p>
    <ul>
        <li>DRY</li>
        <li>Reuse</li>
        <li>Modular</li>
        <li>Scalable</li>
    </ul>
</div>

</div>

<script>
let users = [
    { id:1, nama:"Sari" },
    { id:2, nama:"Dina" },
    { id:3, nama:"Tina" }
];

const menus = ["home","data","about"];

/* MENU */
function renderMenu(){
    let html = "";

    for(let i=0;i<menus.length;i++){
        html += `
            <li onclick="showPage('${menus[i]}')" id="menu-${menus[i]}">
                ${menus[i]}
            </li>
        `;
    }

    document.getElementById("menu").innerHTML = html;
}

/* PAGE */
function showPage(page){
    const content = document.getElementsByClassName("content");

    for(let i=0;i<content.length;i++){
        content[i].classList.remove("show");
    }

    document.getElementById(page).classList.add("show");

    for(let i=0;i<menus.length;i++){
        document.getElementById("menu-"+menus[i]).classList.remove("active");
    }

    document.getElementById("menu-"+page).classList.add("active");
}

/* RENDER */
function renderAll(){
    renderTable();
    renderList();
    renderCard();
}

function renderTable(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `
        <tr>
            <td>${users[i].id}</td>
            <td>${users[i].nama}</td>
            <td>
                <button onclick="hapusData(${users[i].id})">Hapus</button>
            </td>
        </tr>
        `;
    }

    document.getElementById("tableBody").innerHTML = html;
}

function renderList(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `<li>${users[i].nama}</li>`;
    }

    document.getElementById("list").innerHTML = html;
}

function renderCard(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `
        <div class="card-item">
            <strong>${users[i].nama}</strong>
            <br><br>
            <button onclick="hapusData(${users[i].id})">Hapus</button>
        </div>
        `;
    }

    document.getElementById("card").innerHTML = html;
}

/* TAMBAH */
function tambahData(){
    const nama = document.getElementById("namaInput").value;

    if(nama === ""){
        alert("Nama tidak boleh kosong!");
        return;
    }

    users.push({
        id:users.length + 1,
        nama:nama
    });

    document.getElementById("namaInput").value = "";
    renderAll();
}

/* HAPUS */
function hapusData(id){
    if(confirm("Yakin hapus data?")){
        users = users.filter(user => user.id !== id);
        renderAll();
    }
}

/* INIT */
renderMenu();
renderAll();
showPage("home");
</script>

</body>
</html>
