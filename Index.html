<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Manager App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef1f7;
    min-height:100vh;
}

/* Layout */
.wrapper{
    display:flex;
    min-height:100vh;
}

/* Sidebar */
.sidebar{
    width:240px;
    background:linear-gradient(180deg,#1e3c72,#2a5298);
    color:white;
    padding:25px;
}

.sidebar h1{
    font-size:24px;
    margin-bottom:25px;
}

#menu{
    list-style:none;
}

#menu li{
    padding:12px 15px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

#menu li:hover,
.active{
    background:rgba(255,255,255,.2);
}

/* Content */
.main{
    flex:1;
    padding:30px;
}

.content{
    display:none;
}

.show{
    display:block;
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Card */
.box{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

/* Form */
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:12px 0;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#2a5298;
    color:white;
}

/* List */
#list li{
    list-style:none;
    padding:10px;
    margin:8px 0;
    background:#f8f9fa;
    border-radius:10px;
}

/* Card View */
.card-item{
    padding:15px;
    margin:10px 0;
    background:#f8f9fa;
    border-left:5px solid #2a5298;
    border-radius:10px;
}

/* Responsive */
@media(max-width:768px){
    .wrapper{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- Sidebar -->
<div class="sidebar">
    <h1>Data App</h1>
    <ul id="menu"></ul>
</div>

<!-- Main -->
<div class="main">

<!-- HOME -->
<div id="home" class="content">
    <div class="box">
        <h2>Dashboard</h2>
        <p>Selamat datang di aplikasi pengelolaan data.</p>
    </div>
</div>

<!-- DATA -->
<div id="data" class="content">

<div class="grid">

<div class="box">
    <h2>Tambah User</h2>
    <input type="text" id="namaInput" placeholder="Masukkan nama">
    <button onclick="tambahData()">Simpan</button>
</div>

<div class="box">
    <h2>Tabel Data</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="box">
    <h2>Daftar Nama</h2>
    <ul id="list"></ul>
</div>

<div class="box">
    <h2>Card User</h2>
    <div id="card"></div>
</div>

</div>
</div>

<!-- ABOUT -->
<div id="about" class="content">
    <div class="box">
        <h2>Tentang</h2>
        <p>Aplikasi ini dibuat dengan konsep sederhana, modular, dan responsive.</p>
    </div>
</div>

</div>
</div>

<script>
let users = [
    {id:1,nama:"Sari"},
    {id:2,nama:"Dina"},
    {id:3,nama:"Tina"}
];

const menus = ["home","data","about"];

/* Menu */
function renderMenu(){
    let html = "";

    for(let i=0;i<menus.length;i++){
        html += `
        <li onclick="showPage('${menus[i]}')" id="menu-${menus[i]}">
            ${menus[i].toUpperCase()}
        </li>`;
    }

    document.getElementById("menu").innerHTML = html;
}

/* Page */
function showPage(page){
    const contents = document.getElementsByClassName("content");

    for(let i=0;i<contents.length;i++){
        contents[i].classList.remove("show");
    }

    document.getElementById(page).classList.add("show");

    for(let i=0;i<menus.length;i++){
        document.getElementById("menu-"+menus[i]).classList.remove("active");
    }

    document.getElementById("menu-"+page).classList.add("active");
}

/* Render */
function renderAll(){
    renderTable();
    renderList();
    renderCard();
}

function renderTable(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `
        <tr>
            <td>${users[i].id}</td>
            <td>${users[i].nama}</td>
            <td>
                <button onclick="hapusData(${users[i].id})">Hapus</button>
            </td>
        </tr>`;
    }

    document.getElementById("tableBody").innerHTML = html;
}

function renderList(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `<li>${users[i].nama}</li>`;
    }

    document.getElementById("list").innerHTML = html;
}

function renderCard(){
    let html = "";

    for(let i=0;i<users.length;i++){
        html += `
        <div class="card-item">
            <strong>${users[i].nama}</strong>
            <br><br>
            <button onclick="hapusData(${users[i].id})">Hapus</button>
        </div>`;
    }

    document.getElementById("card").innerHTML = html;
}

/* Tambah */
function tambahData(){
    const nama = document.getElementById("namaInput").value.trim();

    if(nama==""){
        alert("Nama wajib diisi!");
        return;
    }

    users.push({
        id:users.length+1,
        nama:nama
    });

    document.getElementById("namaInput").value="";
    renderAll();
}

/* Hapus */
function hapusData(id){
    if(confirm("Hapus data ini?")){
        users = users.filter(user => user.id !== id);
        renderAll();
    }
}

/* Init */
renderMenu();
renderAll();
showPage("home");
</script>

</body>
</html>
