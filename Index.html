<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Render Data</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

/* Judul */
header{
    background:#3498db;
    color:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    margin-bottom:20px;
}

/* Menu */
#menu{
    display:flex;
    gap:10px;
    list-style:none;
    margin-bottom:20px;
}

#menu li{
    background:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
}

#menu li:hover,
.active{
    background:#3498db;
    color:white;
}

/* Content */
.content{
    display:none;
}

.show{
    display:block;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* Form */
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    padding:8px 12px;
    border:none;
    background:#3498db;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#3498db;
    color:white;
}

/* List */
#list li{
    background:#f8f9fa;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}

/* Card */
.card-item{
    background:#f8f9fa;
    padding:15px;
    border-radius:8px;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Aplikasi Render Data</h1>
</header>

<ul id="menu"></ul>

<!-- HOME -->
<div id="home" class="content box">
    <h2>Home</h2>
    <p>Selamat datang di aplikasi render data.</p>
</div>

<!-- DATA -->
<div id="data" class="content">

<div class="grid">

<div class="box">
    <h2>Tambah Data</h2>
    <input type="text" id="namaInput" placeholder="Masukkan nama">
    <button onclick="tambahData()">Tambah</button>
</div>

<div class="box">
    <h3>Table</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="box">
    <h3>List</h3>
    <ul id="list"></ul>
</div>

<div class="box">
    <h3>Card</h3>
    <div id="card"></div>
</div>

</div>
</div>

<!-- ABOUT -->
<div id="about" class="content box">
    <h2>About</h2>
    <p>Aplikasi ini menggunakan konsep:</p>
    <ul>
        <li>DRY</li>
        <li>Reuse</li>
        <li>Modular</li>
        <li>Scalable</li>
    </ul>
</div>

</div>

<script>
let users = [
    { id:1, nama:"Sari" },
    { id:2, nama:"Dina" },
    { id:3, nama:"Tina" }
];

const menus = ["home","data","about"];

/* MENU */
function renderMenu(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
            <li onclick="showPage('${data[i]}')" id="menu-${data[i]}">
                ${data[i]}
            </li>
        `;
    }

    document.getElementById("menu").innerHTML = html;
}

/* PAGE */
function showPage(page){
    const contents = document.getElementsByClassName("content");

    for(let i=0;i<contents.length;i++){
        contents[i].classList.remove("show");
    }

    document.getElementById(page).classList.add("show");

    for(let i=0;i<menus.length;i++){
        document.getElementById("menu-"+menus[i]).classList.remove("active");
    }

    document.getElementById("menu-"+page).classList.add("active");
}

/* RENDER */
function renderAll(){
    renderTable(users);
    renderList(users);
    renderCard(users);
}

function renderTable(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <tr>
            <td>${data[i].id}</td>
            <td>${data[i].nama}</td>
            <td>
                <button onclick="hapusData(${data[i].id})">
                    Hapus
                </button>
            </td>
        </tr>
        `;
    }

    document.getElementById("tableBody").innerHTML = html;
}

function renderList(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `<li>${data[i].nama}</li>`;
    }

    document.getElementById("list").innerHTML = html;
}

function renderCard(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <div class="card-item">
            ${data[i].nama}
            <br><br>
            <button onclick="hapusData(${data[i].id})">
                Hapus
            </button>
        </div>
        `;
    }

    document.getElementById("card").innerHTML = html;
}

/* TAMBAH */
function tambahData(){
    const nama = document.getElementById("namaInput").value;

    if(nama === ""){
        alert("Nama tidak boleh kosong!");
        return;
    }

    users.push({
        id:users.length + 1,
        nama:nama
    });

    document.getElementById("namaInput").value = "";
    renderAll();
}

/* HAPUS */
function hapusData(id){
    if(confirm("Yakin hapus data?")){
        users = users.filter(user => user.id !== id);
        renderAll();
    }
}

/* INIT */
renderMenu(menus);
renderAll();
showPage("home");
</script>

</body>
</html>
