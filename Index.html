<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Render Data Modern</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    color:#fff;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* HEADER */
header{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    margin-bottom:20px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:8px;
    opacity:.9;
}

/* MENU */
#menu{
    display:flex;
    gap:12px;
    list-style:none;
    margin-bottom:20px;
    flex-wrap:wrap;
}

#menu li{
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    transition:.3s;
}

#menu li:hover,
.active{
    background:#fff;
    color:#333;
    transform:translateY(-3px);
}

/* CONTENT */
.content{
    display:none;
}

.show{
    display:block;
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* BOX */
.box{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    padding:22px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* FORM */
input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin:12px 0;
    outline:none;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#fff;
    color:#333;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:#f1f1f1;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid rgba(255,255,255,.2);
}

th{
    color:#ffeaa7;
}

tr:hover{
    background:rgba(255,255,255,.08);
}

/* LIST */
#list li{
    list-style:none;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    transition:.3s;
}

#list li:hover{
    transform:translateX(5px);
}

/* CARD */
.card-item{
    padding:15px;
    border-radius:15px;
    margin:10px 0;
    background:rgba(255,255,255,.08);
    transition:.3s;
}

.card-item:hover{
    transform:translateY(-5px);
}

/* RESPONSIVE */
@media(max-width:768px){
    #menu{
        flex-direction:column;
    }

    header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Aplikasi Render Data</h1>
    <p>Modern Dashboard Glassmorphism</p>
</header>

<ul id="menu"></ul>

<!-- HOME -->
<div id="home" class="content box">
    <h2>Home</h2>
    <p>Selamat datang di aplikasi render data modern.</p>
</div>

<!-- DATA -->
<div id="data" class="content">
<div class="grid">

<div class="box">
    <h2>Tambah Data</h2>
    <input type="text" id="namaInput" placeholder="Masukkan nama">
    <button onclick="tambahData()">Tambah</button>
</div>

<div class="box">
    <h3>Table</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="box">
    <h3>List</h3>
    <ul id="list"></ul>
</div>

<div class="box">
    <h3>Card</h3>
    <div id="card"></div>
</div>

</div>
</div>

<!-- ABOUT -->
<div id="about" class="content box">
    <h2>About</h2>
    <p>Aplikasi ini menggunakan konsep:</p>
    <ul>
        <li>DRY</li>
        <li>Reuse</li>
        <li>Modular</li>
        <li>Scalable</li>
    </ul>
</div>

</div>

<script>
let users = [
    {id:1,nama:"Sari"},
    {id:2,nama:"Dina"},
    {id:3,nama:"Tina"}
];

const menus = ["home","data","about"];

function renderMenu(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `<li onclick="showPage('${data[i]}')" id="menu-${data[i]}">${data[i]}</li>`;
    }

    document.getElementById("menu").innerHTML = html;
}

function showPage(page){
    const content = document.getElementsByClassName("content");

    for(let i=0;i<content.length;i++){
        content[i].classList.remove("show");
    }

    document.getElementById(page).classList.add("show");

    for(let i=0;i<menus.length;i++){
        document.getElementById("menu-"+menus[i]).classList.remove("active");
    }

    document.getElementById("menu-"+page).classList.add("active");
}

function renderAll(){
    renderTable(users);
    renderList(users);
    renderCard(users);
}

function renderTable(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <tr>
            <td>${data[i].id}</td>
            <td>${data[i].nama}</td>
            <td><button onclick="hapusData(${data[i].id})">Hapus</button></td>
        </tr>`;
    }

    document.getElementById("tableBody").innerHTML = html;
}

function renderList(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `<li>${data[i].nama}</li>`;
    }

    document.getElementById("list").innerHTML = html;
}

function renderCard(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <div class="card-item">
            <strong>${data[i].nama}</strong>
            <br><br>
            <button onclick="hapusData(${data[i].id})">Hapus</button>
        </div>`;
    }

    document.getElementById("card").innerHTML = html;
}

function tambahData(){
    const nama = document.getElementById("namaInput").value;

    if(nama==""){
        alert("Nama tidak boleh kosong!");
        return;
    }

    users.push({
        id:users.length+1,
        nama:nama
    });

    document.getElementById("namaInput").value="";
    renderAll();
}

function hapusData(id){
    if(confirm("Yakin hapus data?")){
        users = users.filter(user => user.id !== id);
        renderAll();
    }
}

renderMenu(menus);
renderAll();
showPage("home");
</script>

</body>
</html>
