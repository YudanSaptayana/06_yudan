<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Render Data</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#dfe9f3,#ffffff);
    min-height:100vh;
    padding:20px;
    color:#333;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* Header */
header{
    background:linear-gradient(135deg,#3498db,#6dd5fa);
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

header h1{
    font-size:32px;
}

header p{
    margin-top:8px;
    opacity:.9;
}

/* Menu */
#menu{
    display:flex;
    gap:12px;
    list-style:none;
    margin-bottom:20px;
    flex-wrap:wrap;
}

#menu li{
    background:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
    transition:.3s;
}

#menu li:hover,
.active{
    background:#3498db;
    color:white;
    transform:translateY(-3px);
}

/* Content */
.content{
    display:none;
}

.show{
    display:block;
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Box */
.box{
    background:white;
    padding:22px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

/* Form */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#3498db;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#3498db;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#2980b9;
    transform:scale(1.05);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#3498db;
    color:white;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

tr:hover{
    background:#f8f9fa;
}

/* List */
#list li{
    list-style:none;
    background:#f8f9fa;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    transition:.3s;
}

#list li:hover{
    transform:translateX(5px);
}

/* Card */
.card-item{
    background:linear-gradient(135deg,#ffffff,#f1f7ff);
    padding:15px;
    border-radius:12px;
    margin:10px 0;
    box-shadow:0 5px 10px rgba(0,0,0,.05);
    transition:.3s;
}

.card-item:hover{
    transform:translateY(-4px);
}

/* About */
.about-list li{
    margin:8px 0;
}

/* Responsive */
@media(max-width:768px){
    #menu{
        flex-direction:column;
    }

    header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Aplikasi Render Data</h1>
    <p>Tampilan Modern & Lebih Menarik</p>
</header>

<ul id="menu"></ul>

<!-- HOME -->
<div id="home" class="content box">
    <h2>Home</h2>
    <p>Selamat datang di aplikasi render data.</p>
</div>

<!-- DATA -->
<div id="data" class="content">

<div class="grid">

<div class="box">
    <h2>Tambah Data</h2>
    <input type="text" id="namaInput" placeholder="Masukkan nama">
    <button onclick="tambahData()">Tambah</button>
</div>

<div class="box">
    <h3>Table</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="box">
    <h3>List</h3>
    <ul id="list"></ul>
</div>

<div class="box">
    <h3>Card</h3>
    <div id="card"></div>
</div>

</div>
</div>

<!-- ABOUT -->
<div id="about" class="content box">
    <h2>About</h2>
    <p>Aplikasi ini menggunakan konsep:</p>
    <ul class="about-list">
        <li>DRY</li>
        <li>Reuse</li>
        <li>Modular</li>
        <li>Scalable</li>
    </ul>
</div>

</div>

<script>
let users = [
    { id:1, nama:"Sari" },
    { id:2, nama:"Dina" },
    { id:3, nama:"Tina" }
];

const menus = ["home","data","about"];

function renderMenu(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <li onclick="showPage('${data[i]}')" id="menu-${data[i]}">
            ${data[i]}
        </li>
        `;
    }

    document.getElementById("menu").innerHTML = html;
}

function showPage(page){
    const contents = document.getElementsByClassName("content");

    for(let i=0;i<contents.length;i++){
        contents[i].classList.remove("show");
    }

    document.getElementById(page).classList.add("show");

    for(let i=0;i<menus.length;i++){
        document.getElementById("menu-"+menus[i]).classList.remove("active");
    }

    document.getElementById("menu-"+page).classList.add("active");
}

function renderAll(){
    renderTable(users);
    renderList(users);
    renderCard(users);
}

function renderTable(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <tr>
            <td>${data[i].id}</td>
            <td>${data[i].nama}</td>
            <td>
                <button onclick="hapusData(${data[i].id})">Hapus</button>
            </td>
        </tr>
        `;
    }

    document.getElementById("tableBody").innerHTML = html;
}

function renderList(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `<li>${data[i].nama}</li>`;
    }

    document.getElementById("list").innerHTML = html;
}

function renderCard(data){
    let html = "";

    for(let i=0;i<data.length;i++){
        html += `
        <div class="card-item">
            <strong>${data[i].nama}</strong>
            <br><br>
            <button onclick="hapusData(${data[i].id})">Hapus</button>
        </div>
        `;
    }

    document.getElementById("card").innerHTML = html;
}

function tambahData(){
    const nama = document.getElementById("namaInput").value;

    if(nama === ""){
        alert("Nama tidak boleh kosong!");
        return;
    }

    users.push({
        id:users.length + 1,
        nama:nama
    });

    document.getElementById("namaInput").value = "";
    renderAll();
}

function hapusData(id){
    if(confirm("Yakin hapus data?")){
        users = users.filter(user => user.id !== id);
        renderAll();
    }
}

renderMenu(menus);
renderAll();
showPage("home");
</script>

</body>
</html>
